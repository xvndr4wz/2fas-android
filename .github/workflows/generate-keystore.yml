name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore debug_signing.jks \
            -alias debugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=Debug,OU=Debug,O=Debug,L=Debug,ST=Debug,C=US"
          base64 -i debug_signing.jks > keystore_b64.txt
          cat keystore_b64.txt

      - name: Upload keystore base64
        uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore_b64.txt
